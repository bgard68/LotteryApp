name: Dependabot lock-file sync

# Why this exists
# ---------------
# LotteryApp restores in locked mode under Central Package Management. Dependabot
# bumps the version in Directory.Packages.props but regenerates only some of the
# eight packages.lock.json files, so CI fails with NU1004 and the PR sits red —
# exactly what had to be fixed by hand for #154 and #155. This workflow does that
# fix automatically: it regenerates every lock file and pushes the result back onto
# the Dependabot branch. The existing dependabot-auto-merge workflow then lands it.
#
# Credentials — no long-lived / plaintext token
# ----------------------------------------------
# The push has to come from an identity other than the default GITHUB_TOKEN, or the
# new commit will not re-trigger the required checks (GitHub suppresses that to avoid
# loops) and auto-merge would never see green. Instead of a stored PAT we mint a
# GitHub App installation token at runtime: short-lived (~1h), never written to disk,
# masked in logs. Only the App's private key is stored, as a Dependabot secret
# (encrypted at rest) — and Dependabot secrets are the only secret store exposed to
# workflows that Dependabot triggers.
#
# One-time setup (done in the GitHub UI, the key never leaves GitHub):
#   1. Create a GitHub App (owner: bgard68) with repo permissions
#        Contents: Read and write   |   Pull requests: Read and write
#      Install it on LotteryApp. Generate a private key (.pem).
#   2. LotteryApp > Settings > Secrets and variables > Dependabot > add:
#        DEPENDABOT_APP_ID           = the App's numeric ID
#        DEPENDABOT_APP_PRIVATE_KEY  = the full .pem contents
#      (Dependabot secrets, NOT Actions secrets — this workflow runs on Dependabot PRs.)
#
# No loop: the App's push is authored by the App, not dependabot[bot], so the
# actor guard below is false on the re-run and this job simply skips.

on: pull_request

permissions:
  contents: read          # the minted App token does the writing, not GITHUB_TOKEN

jobs:
  sync-lockfiles:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Identify the update
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Stay dormant until the App is configured, so merging this workflow before the
      # one-time setup never adds a failing job. Ready only for nuget PRs with the
      # App secret present.
      - name: Is the lock-file sync configured?
        id: gate
        env:
          APP_ID: ${{ secrets.DEPENDABOT_APP_ID }}
        run: |
          if [ "${{ steps.meta.outputs.package-ecosystem }}" = "nuget" ] && [ -n "$APP_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.meta.outputs.package-ecosystem }}" = "nuget" ]; then
              echo "::notice::DEPENDABOT_APP_ID not set — skipping lock-file sync. See the workflow header for one-time setup."
            fi
          fi

      - name: Mint a short-lived App token
        if: steps.gate.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDABOT_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}

      - name: Check out the PR branch
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up .NET
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Regenerate and push lock files if they drifted
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          dotnet restore --force-evaluate
          if [ -z "$(git status --porcelain -- '**/packages.lock.json')" ]; then
            echo "Lock files already consistent — nothing to push."
            exit 0
          fi
          git config user.name  'dependabot[bot]'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git commit -am 'build(deps): sync packages.lock.json (dotnet restore --force-evaluate)'
          git push
