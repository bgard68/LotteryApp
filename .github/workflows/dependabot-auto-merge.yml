name: Dependabot auto-merge

# Turns on GitHub's native auto-merge for Dependabot pull requests, so a PR whose
# every required status check passes merges itself instead of waiting for a human
# to press the button. Branch protection still fully gates the merge — nothing lands
# red, and required reviews (if any) are still enforced.
#
# Scope: minor and patch updates only. Major bumps are left open on purpose, so a
# person looks at the changelog before they land.
#
# Requires "Allow auto-merge" to be enabled in Settings > General (it is for this
# repo). Uses only the automatic GITHUB_TOKEN — no PAT or extra secrets.
#
# Note: this does not fix a red PR. LotteryApp restores in locked mode under Central
# Package Management, so a Dependabot bump that leaves a packages.lock.json stale
# fails with NU1004 and will sit here un-merged (correctly) until the lock files are
# regenerated. dependabot-lockfile-sync.yml does that automatically, after which the
# PR goes green and this workflow lands it.

on: pull_request

# Read-only by default; the one job that needs it grants itself the minimum below.
permissions:
  contents: read

jobs:
  auto-merge:
    # The PR's author, not github.actor. github.actor is whoever caused this event,
    # which stops being Dependabot as soon as dependabot-lockfile-sync.yml pushes the
    # regenerated lock files: the synchronize run is attributed to github-actions[bot]
    # and this job skips. That made the lock-file PRs — the ones that need the most
    # help — the only ones auto-merge never touched.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scoped to the job, not the workflow, so the workflow default stays read-only.
    #
    # contents: write is required, not optional: `gh pr merge --auto` calls the
    # enablePullRequestAutoMerge mutation, which GitHub gates on contents: write
    # even though GitHub performs the merge itself later. Dropping it for
    # least-privilege reasons (#158) made this job fail on every Dependabot PR
    # with "Resource not accessible by integration", so nothing auto-merged at all.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
