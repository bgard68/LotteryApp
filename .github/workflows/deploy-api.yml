name: Deploy API

# Live: backend changes deploy automatically. Path-filtered so a docs or
# frontend-only change never triggers a deployment (decision D15 - the two
# halves deploy independently).
#
# Authentication is OIDC federation - no stored credential (D14). The
# post-deploy smoke test is the gate: a red run means a broken deploy is known
# immediately rather than when a visitor finds it (D17).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Directory.*.props"
      - "global.json"
      - "scripts/smoke-test.ps1"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC federation - GitHub proves its identity per run

# Two merges in quick succession would otherwise race, and the older build can
# win. Serialise instead of cancelling: a half-finished deploy is worse than a
# queued one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Test before deploy
        run: dotnet test

      # -r linux-x64 targets the App Service platform, which drops the native
      # SQLite binaries for ~30 platforms we never run on (android, iOS, wasm,
      # s390x...): 130 MB -> 52 MB. --self-contained false keeps using the
      # shared runtime on the App Service rather than shipping our own.
      # PDBs are deliberately kept: on a free tier with no APM, readable
      # production stack traces are worth a few hundred KB.
      - name: Publish
        run: dotnet publish src/Lottery.Api -c Release -r linux-x64 --self-contained false -o publish

      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.API_APP_NAME }}
          package: publish

      # The deploy gate (decision D17): a red smoke test fails the deployment
      # run, so a broken deploy is known immediately - not when a visitor finds it.
      - name: Post-deploy smoke test
        shell: pwsh
        env:
          # Passed as an environment variable rather than an argument, so the key
          # never appears in a command line. With it the test asserts both that
          # the refresh endpoint accepts the key and that it rejects a caller
          # without one; the script waits for /healthz before asserting, because
          # a post-deploy run races App Service recycling the app.
          REFRESH_KEY: ${{ secrets.REFRESH_KEY }}
        run: ./scripts/smoke-test.ps1 -BaseUrl ${{ vars.API_BASE_URL }}
