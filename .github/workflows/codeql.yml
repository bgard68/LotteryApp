name: CodeQL

# This branch carries the Angular app, so it analyzes JavaScript/TypeScript.
# The C# API is analyzed by main's own CodeQL workflow - the branches are never
# merged, so each maintains the analysis its code needs. Without this file the
# frontend would have no static analysis at all (audit finding F1).
on:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]
  schedule:
    - cron: "30 5 * * 1" # weekly, so alerts surface even when the repo is quiet

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false

      # build-mode none is correct for JS/TS: CodeQL analyzes the sources
      # directly, no compilation step is involved.
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:javascript-typescript"
