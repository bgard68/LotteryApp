name: CodeQL

# Both languages now live in this repository - the API under src/ and the
# Angular app under lottery-web/ - so one workflow analyzes both, as a matrix.
# Previously these were two separate files on two branches, which is how the
# frontend ended up on a different codeql-action version from the backend and
# its Analyze job failed for weeks before anyone noticed.
on:
  push:
    branches: [main]
    # Documentation cannot break a build, so a docs-only push does not run
    # one. Deliberately on `push` only: `pull_request` stays unfiltered because
    # these are required status checks, and a required check that is SKIPPED
    # never reports - leaving the pull request blocked forever rather than
    # passing. ci-frontend.yml already documents the same reasoning.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "demo/**"
      - "LICENSE"
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1" # weekly, so alerts surface even when the repo is quiet

permissions:
  contents: read

# A push that supersedes an in-flight run makes that run's verdict irrelevant.
# Cancelling frees the queue instead of leaving work for cleanup-runs to prune.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The narrowest grant that lets analyze upload its SARIF - code scanning
      # has no read-only ingest path, so this is the floor rather than a
      # convenience. Scoped to this job; the workflow default stays read-only.
      security-events: write
      contents: read

    strategy:
      # One language failing must not hide the other's results.
      fail-fast: false
      matrix:
        include:
          # build-mode: manual for C#. Buildless analysis does not fully
          # resolve dependencies, so dataflow through libraries - our Dapper
          # SQL paths and the feed HTTP clients - is where it is weakest. A
          # real build costs ~2 minutes and materially improves fidelity.
          - language: csharp
            build-mode: manual
          # build-mode: none is correct for JS/TS - CodeQL reads the sources
          # directly, no compilation is involved.
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build --no-incremental

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:${{ matrix.language }}"
