name: CodeQL

# C# analysis for the API. The Angular app lives on the frontend branch and is
# analyzed by that branch's own CodeQL workflow (JavaScript/TypeScript) - the
# branches are never merged, so each carries the analysis its code needs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1" # weekly, so alerts surface even when the repo is quiet

permissions:
  contents: read

# A push that supersedes an in-flight run makes that run's verdict irrelevant.
# Cancelling frees the queue instead of leaving work for cleanup-runs to prune.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The narrowest grant that lets analyze upload its SARIF - code scanning
      # has no read-only ingest path, so this is the floor rather than a
      # convenience. Scoped to this job; the workflow default stays read-only.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # build-mode: manual (was: none). Buildless C# analysis does not fully
      # resolve dependencies, so dataflow through libraries - our Dapper SQL
      # paths and the feed HTTP clients - is where it is weakest. A real build
      # costs ~2 minutes and materially improves fidelity.
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build --no-incremental

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:csharp"
