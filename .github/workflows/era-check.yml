name: Era check

# Lotteries change their number matrices in the real world, not on our commit
# schedule (see decision D10 and lessons-learned #6). This weekly run executes
# the full test suite (including the era-coverage test over all committed
# history) AND validates the LIVE feed: a refresh cycle that skips era-invalid
# draws means either bad feed data or an undocumented rule change - both must
# fail loudly within days, not on the next push.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  era-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Full test suite (includes era coverage of all history)
        run: dotnet test

      - name: Start API
        run: |
          set -euo pipefail
          dotnet run --project src/Lottery.Api --urls http://localhost:5090 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5090/healthz && break
            sleep 2
          done
          # The loop above exits 0 whether or not the API ever came up - the
          # final `sleep` returns 0. Without this the failure is attributed to
          # whatever runs next, and in this workflow it was not attributed at
          # all: see the validation step below.
          curl -fsS http://localhost:5090/healthz > /dev/null \
            || { echo "::error::API did not become healthy within 60s."; exit 1; }

      - name: Live-feed era validation
        run: |
          # Strict mode matters more here than anywhere else in the repo. This
          # step is the ONLY thing watching for an undocumented rule change,
          # and without `set -e` an unreachable API left RESPONSE empty, jq
          # printed nothing, and `[ "" -gt 0 ]` returned 2 - which makes the
          # `if` false, so the step PASSED. A monitor that goes green when it
          # cannot see anything is worse than no monitor.
          set -euo pipefail
          RESPONSE=$(curl -fsS -X POST http://localhost:5090/internal/refresh)
          echo "$RESPONSE" | jq .
          SKIPPED=$(echo "$RESPONSE" | jq '[.[].skippedInvalid] | add // 0')
          case "$SKIPPED" in
            ''|*[!0-9]*)
              echo "::error::Could not read skippedInvalid from the refresh response."
              exit 1 ;;
          esac
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::error::$SKIPPED era-invalid draw(s) in the live feed - possible undocumented rule change. Update RuleEras and refresh the snapshots (see docs/REQUIREMENTS-AND-DECISIONS.md D10)."
            exit 1
          fi
