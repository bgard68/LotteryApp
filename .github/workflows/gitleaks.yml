name: Secret scan

# Covers the gap GitHub's free tier leaves: provider patterns catch ~200 known
# vendor formats, but GENERIC secrets - a Socrata token, a hand-written
# connection string, an Azure key pasted into a template - need non-provider
# patterns, which require Advanced Security (unavailable here). See
# docs/SECURITY-POSTURE.md.
#
# Deliberately added before any Azure provisioning work: a scanner installed
# after the risky commits have landed is theatre.
on:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]
  schedule:
    - cron: "0 7 * * 1" # weekly full-history sweep

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the scheduled run re-validates every commit ever
          # made, not just the current diff.
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        # Pinned to a commit, not a moving tag: third-party code running on
        # every push and PR, and @v2 can be repointed at any time.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true
