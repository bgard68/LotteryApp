name: Deploy frontend

# SKELETON - manual trigger only until the Azure Static Web App exists.
# Once provisioned and linked to the App Service (SWA "linked backend"
# proxies /api/* -> same origin, no CORS; decision D15):
#   1. Set the repo secret AZURE_STATIC_WEB_APPS_API_TOKEN (SWA deployment
#      token) - or migrate to OIDC when SWA supports it for this flow.
#   2. Uncomment the push trigger so frontend changes deploy independently
#      of the API. This workflow lives on the frontend branch (the Angular
#      app is never merged into main).
on:
  workflow_dispatch:
  # push:
  #   branches: [frontend]
  #   paths:
  #     - "lottery-web/**"
  #     - ".github/workflows/deploy-web.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lottery-web/package-lock.json

      - name: Install, test, build
        working-directory: lottery-web
        run: |
          npm ci
          npx ng test --watch=false --browsers=ChromeHeadless
          npx ng build

      # The free Static Web Apps SKU cannot proxy to a backend, so the browser
      # calls the API origin directly. Written at deploy time from a repository
      # VARIABLE (a public URL, not a secret) so one build artefact works in any
      # environment - see docs/AZURE-DEPLOYMENT.md.
      - name: Write runtime config
        run: |
          printf '{"apiBaseUrl":"%s"}' "${{ vars.API_BASE_URL }}" \
            > lottery-web/dist/lottery-web/browser/config.json
          cat lottery-web/dist/lottery-web/browser/config.json

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: lottery-web/dist/lottery-web/browser
          output_location: ""
