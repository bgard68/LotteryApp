name: Branch isolation

# `main` is the backend/API branch; `frontend` is the Angular branch. They
# share early history but are NEVER merged in either direction.
#
# Branch protection cannot express "this base may not receive that head", so
# this check does - and it is a required status check on both branches, which
# makes the rule enforced rather than remembered.
on:
  pull_request:
    branches: [main, frontend]

permissions:
  contents: read

jobs:
  isolation:
    name: Branch isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the ancestry test below needs real merge-bases.
          fetch-depth: 0

      - name: Reject cross-branch merges
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          case "$BASE" in
            main)     other=frontend ;;
            frontend) other=main ;;
            *)        echo "Base '$BASE' is not an isolated branch - nothing to check."; exit 0 ;;
          esac

          # The obvious case: opening frontend -> main directly, or vice versa.
          if [ "$HEAD" = "$other" ]; then
            echo "::error::'$other' may never be merged into '$BASE'."
            exit 1
          fi

          # The sneaky case: a feature branch that merged the other branch in
          # first. GitHub checks out the merge commit for pull_request, so if
          # the other branch's tip is an ancestor of it, those commits are
          # riding along.
          git fetch --quiet origin "$other"
          if git merge-base --is-ancestor "origin/$other" HEAD; then
            echo "::error::This branch contains the tip of '$other' - it was merged in somewhere. Remove that merge before targeting '$BASE'."
            exit 1
          fi

          echo "OK: '$HEAD' -> '$BASE' carries no commits from '$other'."
