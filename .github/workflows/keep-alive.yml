name: Keep alive

# Free-tier alternative to App Service Always On (decision D16): ping the
# deployed API around draw times so it is awake to fetch results, and trigger
# a refresh cycle shortly after each drawing. Draw times in UTC:
#   Powerball    Mon/Wed/Sat 22:59 ET -> Tue/Thu/Sun 02:59 (EDT) or 03:59 (EST)
#   Mega Millions Tue/Fri     23:00 ET -> Wed/Sat     03:00 (EDT) or 04:00 (EST)
# The cron pairs cover both DST offsets; extra pings are harmless.
#
# INACTIVE until the repo variable API_BASE_URL is set (Settings -> Secrets
# and variables -> Actions -> Variables), e.g. https://<app>.azurewebsites.net
# - every run before that exits successfully as a no-op.
on:
  schedule:
    - cron: "45 2 * * 0,2,4"  # pre-draw warm-up, Powerball nights (EDT)
    - cron: "10 3 * * 0,2,4"  # post-draw refresh, Powerball (EDT)
    - cron: "10 4 * * 0,2,4"  # post-draw refresh, Powerball (EST)
    - cron: "45 2 * * 3,6"    # pre-draw warm-up, Mega Millions nights (EDT)
    - cron: "15 3 * * 3,6"    # post-draw refresh, Mega Millions (EDT)
    - cron: "15 4 * * 3,6"    # post-draw refresh, Mega Millions (EST)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm and refresh
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          REFRESH_KEY: ${{ secrets.REFRESH_KEY }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL not configured - nothing deployed yet; no-op."
            exit 0
          fi
          curl -fsS "$API_BASE_URL/healthz"
          curl -fsS -X POST "$API_BASE_URL/internal/refresh" \
            ${REFRESH_KEY:+-H "X-Refresh-Key: $REFRESH_KEY"} | head -c 2000
