name: CI frontend

# The Angular app lives ONLY on the frontend branch (never merged into main),
# so this workflow triggers there alone.
on:
  push:
    branches: [frontend]
    paths:
      - "lottery-web/**"
      - ".github/workflows/ci-frontend.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Angular build + specs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lottery-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lottery-web/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Specs (ChromeHeadless)
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Production build
        run: npx ng build

  client-drift:
    name: OpenAPI client drift check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start API
        run: |
          dotnet run --project src/Lottery.Api --urls http://localhost:5090 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5090/healthz && break
            sleep 2
          done

      # Regenerate the committed TypeScript API types from the live OpenAPI
      # document and fail on any diff - the frontend can never quietly
      # disagree with the backend contract (decision D20).
      - name: Regenerate and diff
        run: |
          npx --yes openapi-typescript http://localhost:5090/openapi/v1.json \
            -o lottery-web/src/app/core/api/schema.d.ts
          git diff --exit-code -- lottery-web/src/app/core/api/schema.d.ts \
            || { echo "::error::Generated API client is stale - regenerate schema.d.ts"; exit 1; }
