name: CI

# This branch's copy governs frontend. main carries its own copy targeting that
# branch - the two are never merged, so each is maintained independently.
# The backend suite runs here too: this branch contains the API source, and
# branch protection needs a check that runs on every PR.
on:
  push:
    branches: [frontend]
  pull_request:
    branches: [frontend]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, tests, live smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, so the job token has no use after the clone.
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build

      # The smoke test runs against a REAL local instance: first boot migrates
      # SQLite and seeds from the committed snapshots (offline), so this proves
      # the whole stack end to end on every push.
      - name: Start API
        run: |
          set -euo pipefail
          # --no-launch-profile and an explicit environment, matching main's
          # copy. `dotnet run` otherwise applies launchSettings.json, which
          # forces Development and OVERRIDES ASPNETCORE_ENVIRONMENT - so this
          # check ran against a different configuration from the
          # identically-named required check on main, while branch protection
          # showed the same green name on both.
          ASPNETCORE_ENVIRONMENT=Production dotnet run --project src/Lottery.Api --no-build --no-launch-profile --urls http://localhost:5090 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5090/healthz && break
            sleep 2
          done
          # The loop exits 0 even when the API never came up.
          curl -fsS http://localhost:5090/healthz > /dev/null \
            || { echo "::error::API did not become healthy within 60s."; exit 1; }

      - name: Smoke test (all endpoints incl. error conditions)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -BaseUrl http://localhost:5090
