version: 2

# One branch now carries both halves, so every ecosystem is scanned from the
# default branch and no entry needs `target-branch`. The previous two-branch
# layout needed it, and getting it wrong is why the frontend's NuGet packages
# went unscanned entirely - ignore rules and ecosystems are per-entry, so each
# had to be declared twice and one of them simply was not.
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.0.x requires Microsoft.OpenApi
      # >= 2.7.5 && < 3.0.0, so a 3.x bump fails the restore outright
      # (NU1608, promoted to an error here). The PR cannot pass and cannot be
      # merged, so it is noise rather than a signal. Drop this entry when
      # AspNetCore.OpenApi takes a 3.x dependency.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/lottery-web"
    schedule:
      interval: "weekly"
    groups:
      # Angular ships its packages in lockstep; bumping them together avoids
      # a broken half-upgraded state across a dozen separate PRs.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "ng-packagr"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Both are capped by a peer dependency, so a major bump fails `npm ci`
      # on ERESOLVE and the PR can never go green. Ignoring the major keeps
      # minor and patch updates - including security ones - flowing.
      #
      # @angular/build 22.x requires typescript >=6.0 <6.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # karma-jasmine-html-reporter 2.2 requires jasmine-core ^4 || ^5 || ^6.
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action/init and /analyze share a config file and refuse to run at
      # different versions - "Loaded a configuration file for version X, but
      # running version Y". Ungrouped, Dependabot proposes each half as its own
      # PR and neither can merge alone: #133 and #137 both failed Analyze and
      # were closed, and main reached 4.37.9 by hand instead. No update-types
      # filter, because a major has to carry both halves too.
      codeql-action:
        patterns: ["github/codeql-action*"]
